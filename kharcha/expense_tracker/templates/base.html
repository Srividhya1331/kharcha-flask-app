<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kharcha{% endblock %} · Kharcha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('main.dashboard') }}">Kharcha</a>
      {% if current_user.is_authenticated %}
      <nav class="nav" aria-label="Main">
        <a href="{{ url_for('main.dashboard') }}" {% if request.endpoint == 'main.dashboard' %}aria-current="page"{% endif %}>Overview</a>
        <a href="{{ url_for('main.expenses') }}" {% if request.endpoint == 'main.expenses' %}aria-current="page"{% endif %}>Expenses</a>
        <a href="{{ url_for('main.budgets') }}" {% if request.endpoint == 'main.budgets' %}aria-current="page"{% endif %}>Budgets</a>
      </nav>
      <div class="topbar-actions">
        <a class="btn btn-primary" href="{{ url_for('main.new_expense') }}">Add expense</a>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-quiet" type="submit">Log out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}" role="status">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
