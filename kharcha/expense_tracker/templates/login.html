{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth">
  <h1>Log in to Kharcha</h1>
  <p class="muted">See where your money went this month.</p>
  {% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" value="{{ request.form.get('email', '') }}" autocomplete="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
