{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth">
  <h1>Create your account</h1>
  <p class="muted">Free, and your data stays in your own database.</p>
  <form method="post" class="stack" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name
      <input type="text" name="name" value="{{ values.get('name', '') }}" autocomplete="name" required>
      {% if errors.name %}<span class="field-error">{{ errors.name }}</span>{% endif %}
    </label>
    <label>Email
      <input type="email" name="email" value="{{ values.get('email', '') }}" autocomplete="email" required>
      {% if errors.email %}<span class="field-error">{{ errors.email }}</span>{% endif %}
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      {% if errors.password %}<span class="field-error">{{ errors.password }}</span>{% endif %}
    </label>
    <label>Confirm password
      <input type="password" name="confirm" autocomplete="new-password" required>
      {% if errors.confirm %}<span class="field-error">{{ errors.confirm }}</span>{% endif %}
    </label>
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
